<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            margin: 20px auto;
            max-width: 600px;
        }
        #error-message {
            font-size: 3rem;
            color: red;
            margin: 20px 0;
        }
        #error-image {
            width: 300px;
            margin-top: 20px;
        }
        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1.2rem;
            color: #fff;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }
        .back-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="error-message">¡MUY MAL, NO SABES!</div>
        <img id="error-image" src="imagen/Enojado.png" alt="Error Imagen">
        <a href="index.html" class="back-button">Volver al Inicio</a>
    </div>
</body>
</html>
